<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1355" height="364" contentStyleType="text/css" preserveAspectRatio="none" version="1.1" viewBox="0 0 1355 364" zoomAndPan="magnify" style="width:1355px;height:364px;background:#fff"><g><rect style="stroke:none;stroke-width:1" id="_title" width="313" height="26.297" x="514" y="5" fill="none"/><text x="519" y="22.995" fill="#000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="303">Top Level Context Diagram (C4 Model)</text><g id="elem_personAlias"><ellipse style="stroke:#073b6f;stroke-width:.5" cx="108.5" cy="159.912" fill="#08427B" rx="27.616" ry="27.616"/><rect width="203" height="85.188" x="7" y="187.528" fill="#08427B" rx="27.616" ry="27.616" style="stroke:#073b6f;stroke-width:.5"/><text x="80" y="208.667" fill="#FFF" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="57">«person»</text><text x="88" y="226.349" fill="#FFF" font-family="sans-serif" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="41">User</text><text x="17" y="259.414" fill="#FFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183">A user of GOAT application</text></g><g id="elem_goatclient"><rect width="219" height="134.078" x="307" y="135.297" fill="#1168BD" rx="2.5" ry="2.5" style="stroke:#3c7fc0;stroke-width:.5"/><text x="388" y="156.435" fill="#FFF" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="57">«system»</text><text x="346.5" y="174.117" fill="#FFF" font-family="sans-serif" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="140">Web application</text><text x="332" y="207.183" fill="#FFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165">Allows users to conduct</text><text x="317" y="223.48" fill="#FFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="195">analysis, evaluate scenarios,</text><text x="323.5" y="239.776" fill="#FFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="182">manage data and visualize</text><text x="359.5" y="256.073" fill="#FFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="114">(geo)information</text></g><g id="elem_authentication"><rect width="218" height="117.781" x="727" y="240.297" fill="#999" rx="2.5" ry="2.5" style="stroke:#8a8a8a;stroke-width:.5"/><text x="778.5" y="261.435" fill="#FFF" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="115">«external_system»</text><text x="771" y="279.117" fill="#FFF" font-family="sans-serif" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="130">Authentication</text><text x="762.5" y="312.183" fill="#FFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="143">Authenticates users,</text><text x="737" y="328.479" fill="#FFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="194">provides access tokens and</text><text x="750.5" y="344.776" fill="#FFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="171">manages user accounts.</text></g><g id="elem_authorization"><rect width="213" height="117.781" x="729.5" y="44.297" fill="#1168BD" rx="2.5" ry="2.5" style="stroke:#3c7fc0;stroke-width:.5"/><text x="807.5" y="65.436" fill="#FFF" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="57">«system»</text><text x="777" y="83.117" fill="#FFF" font-family="sans-serif" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="118">Authorization</text><text x="740" y="116.183" fill="#FFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188">Authorizes users to access</text><text x="739.5" y="132.48" fill="#FFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="189">resources such as features</text><text x="804" y="148.776" fill="#FFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64">and data.</text></g><g id="elem_goatapplication"><rect width="215" height="117.781" x="1134" y="44.297" fill="#1168BD" rx="2.5" ry="2.5" style="stroke:#3c7fc0;stroke-width:.5"/><text x="1213" y="65.436" fill="#FFF" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="57">«system»</text><text x="1165.5" y="83.117" fill="#FFF" font-family="sans-serif" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="152">GOAT Application</text><text x="1144" y="116.183" fill="#FFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="191">Contains the functionality of</text><text x="1147.5" y="132.48" fill="#FFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="184">storing and managing data</text><text x="1158" y="148.776" fill="#FFF" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="167">and compute indicators.</text></g><g id="link_personAlias_goatclient"><path style="stroke:#666;stroke-width:1" id="personAlias-to-goatclient" fill="none" d="M210.12,202.2969 C238.46,202.2969 269.53,202.2969 298.73,202.2969"/><polygon style="stroke:#666;stroke-width:1" fill="#666" points="306.91 202.297 298.91 199.297 298.91 205.297 306.91 202.297"/><text x="241" y="199.435" fill="#666" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="35">Uses</text></g><g id="link_goatclient_authentication"><path style="stroke:#666;stroke-width:1" id="goatclient-to-authentication" fill="none" d="M526.1,227.5269 C585.3,241.2869 658.57,258.3069 718.9,272.3169"/><polygon style="stroke:#666;stroke-width:1" fill="#666" points="726.94 274.187 719.83 269.45 718.468 275.293 726.94 274.187"/><text x="576.5" y="233.435" fill="#666" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="100">Authenticates</text></g><g id="link_goatclient_authorization"><path style="stroke:#666;stroke-width:1" id="goatclient-to-authorization" fill="none" d="M526.1,176.5469 C586.11,162.3169 660.58,144.6569 721.36,130.2469"/><polygon style="stroke:#666;stroke-width:1" fill="#666" points="729.46 128.327 720.982 127.265 722.374 133.101 729.46 128.327"/><text x="557" y="121.436" fill="#666" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="135">Requests settings,</text><text x="557" y="135.404" fill="#666" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="139">data and indicators</text></g><g id="link_authorization_authentication"><path style="stroke:#666;stroke-width:1" id="authorization-to-authentication" fill="none" d="M836,162.5869 C836,184.4869 836,209.4669 836,232.0369"/><polygon style="stroke:#666;stroke-width:1" fill="#666" points="836 240.227 839 232.227 833 232.227 836 240.227"/><text x="787.5" y="191.935" fill="#666" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="44">Sends</text><text x="806.5" y="205.904" fill="#666" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="10">&amp;</text><text x="757.5" y="219.873" fill="#666" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="112">Requests token</text></g><g id="link_authorization_authentication"><path style="stroke:#666;stroke-width:1" id="authorization-backto-authentication" fill="none" d="M840.78,170.5069 C841.13,181.1369 841.26,192.0169 841,202.2969 C840.69,214.5169 840.15,227.5969 839.54,240.0669"/><polygon style="stroke:#666;stroke-width:1" fill="#666" points="840.46 162.437 837.777 170.549 843.772 170.313 840.46 162.437"/></g><g id="link_authorization_goatapplication"><path style="stroke:#666;stroke-width:1" id="authorization-to-goatapplication" fill="none" d="M942.75,103.2969 C998.95,103.2969 1068.11,103.2969 1125.62,103.2969"/><polygon style="stroke:#666;stroke-width:1" fill="#666" points="1133.66 103.297 1125.66 100.297 1125.66 106.297 1133.66 103.297"/><text x="976" y="100.436" fill="#666" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="127">Forwards request</text></g></g></svg>